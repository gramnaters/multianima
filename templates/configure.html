<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Multianima - Configure</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--surface:#161b22;--surface-2:#1c2333;--surface-3:#252d3d;--text:#f0f3f6;--muted:#8b949e;--subtle:#6e7681;--line:#30363d;--line-strong:#484f58;--accent:#58a6ff;--accent-2:#79c0ff;--danger:#f85149;--green:#3fb950;--shadow:0 8px 24px rgba(0,0,0,0.3);--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg)}
button,input{font:inherit}button{color:inherit}

.app{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:24px 0}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.brand{display:inline-flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.brand-icon{width:36px;height:36px;border-radius:var(--radius);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:20px}
.brand-name{font-size:1rem;font-weight:700}
.brand-sub{color:var(--muted);font-size:.78rem;font-weight:500}

.workspace{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.main{display:grid;gap:16px;min-width:0}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.section{padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.section-title{font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.section-meta{color:var(--subtle);font-size:.76rem;font-weight:500;margin-left:auto}

/* Provider cards */
.provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.provider-card{position:relative;border:1px solid var(--line);border-left:2px solid transparent;border-radius:9px;background:var(--surface-2);cursor:pointer;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,box-shadow .15s,transform .15s}
.provider-card.is-selected{border-left-color:var(--accent);background:rgba(88,166,255,.06)}
.provider-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pc-name{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check-dot{width:18px;height:18px;border:1px solid var(--line-strong);border-radius:99px;display:inline-flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0;transition:background .12s,border-color .12s,color .12s}
.is-selected .check-dot{border-color:var(--accent);color:#111827;background:var(--accent)}
.pc-tags{color:var(--subtle);font-size:.72rem;line-height:1.4;word-break:break-word}
.pc-tag-lead{color:var(--accent);font-weight:600}

/* Quality pills */
.quality-grid{display:flex;flex-wrap:wrap;gap:6px}
.q-pill{min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);cursor:pointer;padding:8px 14px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:border-color .15s,background .15s,transform .15s}
.q-pill.is-selected{border-color:rgba(88,166,255,.5);background:rgba(88,166,255,.08)}
.q-pill:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.q-pill .label{font-weight:600;font-size:.86rem}

/* Language grid */
.lang-grid{display:flex;flex-wrap:wrap;gap:8px}
.lang-pill{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer;padding:7px 14px;font-size:.84rem;font-weight:600;color:var(--muted);transition:all .15s}
.lang-pill.is-selected{color:var(--green);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.08)}
.lang-pill:hover{border-color:var(--line-strong)}

/* Options */
.opt-row{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:8px;background:var(--surface-2)}
.opt-label{font-size:.86rem;font-weight:600}
.switch{flex:none;width:38px;height:22px;padding:0;border:none;border-radius:99px;background:rgba(139,148,158,.4);cursor:pointer;position:relative;transition:background .16s}
.switch.is-on{background:var(--accent)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .16s}
.switch.is-on::after{transform:translateX(16px)}

/* Summary panel */
.summary-panel{padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.sp-title{font-size:.82rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px}
.sp-meta{color:var(--subtle);font-size:.84rem;margin-bottom:12px}
.sp-meta strong{color:var(--text);font-weight:700}
.install-btn{width:100%;min-height:44px;border:none;border-radius:9px;background:var(--accent);color:#111827;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .2s}
.install-btn:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.install-btn:disabled{opacity:.5;cursor:not-allowed}

.url-box{margin-top:12px;padding:10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);word-break:break-all;font-size:.78rem;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:none}
.url-box code{color:var(--accent)}
.copy-btn{margin-top:8px;padding:6px 14px;background:var(--surface-3);color:var(--text);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .15s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}

.footer{margin-top:16px;color:var(--subtle);font-size:.76rem;font-weight:500}

@media(max-width:768px){.workspace{grid-template-columns:1fr}.side{position:static;order:2}.provider-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="brand" href="/">
      <div class="brand-icon">&#127912;</div>
      <div>
        <div class="brand-name">Multianima</div>
        <div class="brand-sub">Hindi Dub Anime Streamer</div>
      </div>
    </a>
  </div>

  <div class="workspace">
    <div class="main">
      <!-- Providers -->
      <div class="section">
        <div class="section-head">
          <span class="section-title">Streaming Providers</span>
          <span class="section-meta" id="prov-count"></span>
        </div>
        <div class="provider-grid" id="provider-grid"></div>
      </div>

      <!-- Quality -->
      <div class="section">
        <div class="section-head">
          <span class="section-title">Quality</span>
        </div>
        <div class="quality-grid" id="quality-grid"></div>
      </div>

      <!-- Languages -->
      <div class="section">
        <div class="section-head">
          <span class="section-title">Audio Language</span>
        </div>
        <div class="lang-grid" id="lang-grid"></div>
      </div>

      <!-- Options -->
      <div class="section">
        <div class="section-head">
          <span class="section-title">Options</span>
        </div>
        <div style="display:grid;gap:8px" id="options-grid"></div>
      </div>
    </div>

    <div class="side">
      <div class="summary-panel">
        <div class="sp-title">Install</div>
        <div class="sp-meta" id="summary-meta"></div>
        <button class="install-btn" onclick="install()" id="install-btn">Install in Stremio</button>
        <div class="url-box" id="url-box"><code id="addon-url"></code></div>
        <button class="copy-btn" id="copy-btn" onclick="copyUrl()" style="display:none">Copy URL</button>
      </div>
    </div>
  </div>

  <div class="footer">Multianima v2.0 &middot; Streams from 6+ providers &middot; No logs, no tracking</div>
</div>

<script>
const PROVIDERS = [
  {key:'source_animelok', name:'AnimeLok', tags:['Most Streams','Hindi','Tamil','Telugu','Abyss','FlixCloud'], defaultOn:true},
  {key:'source_watchanimeworld', name:'WatchAnimeWorld', tags:['ZephyrFlick','Hindi','Tamil','Telugu'], defaultOn:true},
  {key:'source_animesalt', name:'AnimeSalt', tags:['Hindi','Tamil','English'], defaultOn:true},
  {key:'source_animejoker', name:'AnimeJoker', tags:['Hindi','Multi-Source'], defaultOn:true},
  {key:'source_desidubanime', name:'DesiDubAnime', tags:['HSAStream','Hindi Dub'], defaultOn:true},
  {key:'source_bashapi', name:'BashAPI', tags:['Custom API','English','Hindi'], defaultOn:false},
  {key:'source_animevilla', name:'AnimeVilla', tags:['HSAStream','Kiranime','Cloudscraper'], defaultOn:false},
  {key:'source_aniflix', name:'Aniflix', tags:['Multi-Player','GDMirrorBot','Abyss','TRAWL'], defaultOn:false},
];

const QUALITIES = [
  {key:'res_2160', label:'4K', rank:2160},
  {key:'res_1080', label:'1080p', rank:1080},
  {key:'res_720', label:'720p', rank:720},
  {key:'res_480', label:'480p', rank:480},
  {key:'res_360', label:'360p', rank:360},
];

const LANGS = [
  {key:'audio_hindi', label:'Hindi'},
  {key:'audio_tamil', label:'Tamil'},
  {key:'audio_telugu', label:'Telugu'},
  {key:'audio_english', label:'English'},
  {key:'audio_japanese', label:'Japanese'},
  {key:'audio_malayalam', label:'Malayalam'},
  {key:'audio_kannada', label:'Kannada'},
];

const OPTIONS = [
  {key:'subtitles_disabled', label:'Disable subtitles'},
  {key:'hide_non_seekable', label:'Hide non-seekable streams'},
];

const PRESETS = [
  {id:'default', label:'Default', providers:['source_animelok','source_watchanimeworld','source_animesalt','source_animejoker','source_desidubanime']},
  {id:'minimal', label:'Minimal', providers:['source_animelok','source_watchanimeworld']},
  {id:'all', label:'Everything', providers:PROVIDERS.map(p=>p.key)},
];

let state = {};

function initState(){
  PROVIDERS.forEach(p => state[p.key] = p.defaultOn ? 'on' : 'off');
  QUALITIES.forEach(q => state[q.key] = 'on');
  LANGS.forEach(l => state[l.key] = 'on');
  OPTIONS.forEach(o => state[o.key] = 'off');
}

function buildConfig(){
  return Object.fromEntries(Object.entries(state).filter(([k,v])=>v==='on'));
}

function encodeConfig(config){
  const json = JSON.stringify(config);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');
}

function getAddonUrl(){
  const config = buildConfig();
  const encoded = encodeConfig(config);
  return window.location.origin + '/' + encoded + '/manifest.json';
}

function updateSummary(){
  const provCount = PROVIDERS.filter(p=>state[p.key]==='on').length;
  const langCount = LANGS.filter(l=>state[l.key]==='on').length;
  const qualCount = QUALITIES.filter(q=>state[q.key]==='on').length;
  document.getElementById('summary-meta').innerHTML =
    '<strong>' + provCount + '</strong> providers &middot; <strong>' + langCount + '</strong> languages &middot; <strong>' + qualCount + '</strong> qualities';
  document.getElementById('prov-count').textContent = provCount + '/' + PROVIDERS.length;
  const url = getAddonUrl();
  document.getElementById('addon-url').textContent = url;
}

function renderProviders(){
  const grid = document.getElementById('provider-grid');
  grid.innerHTML = '';
  PROVIDERS.forEach(p => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'provider-card' + (state[p.key]==='on' ? ' is-selected' : '');
    const tags = p.tags || [];
    const lead = tags[0] || '';
    const rest = tags.slice(1).join(' \u00b7 ');
    card.innerHTML =
      '<span class="pc-top"><span class="pc-name">' + p.name + '</span><span class="check-dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span></span>' +
      '<span class="pc-tags">' + (lead ? '<span class="pc-tag-lead">' + lead + '</span> ' : '') + rest + '</span>';
    card.onclick = () => { state[p.key] = state[p.key]==='on' ? 'off' : 'on'; renderAll(); };
    grid.appendChild(card);
  });
}

function renderQualities(){
  const grid = document.getElementById('quality-grid');
  grid.innerHTML = '';
  QUALITIES.forEach(q => {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'q-pill' + (state[q.key]==='on' ? ' is-selected' : '');
    pill.innerHTML = '<span class="label">' + q.label + '</span><span class="check-dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></span>';
    pill.onclick = () => { state[q.key] = state[q.key]==='on' ? 'off' : 'on'; renderAll(); };
    grid.appendChild(pill);
  });
}

function renderLangs(){
  const grid = document.getElementById('lang-grid');
  grid.innerHTML = '';
  LANGS.forEach(l => {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'lang-pill' + (state[l.key]==='on' ? ' is-selected' : '');
    pill.textContent = l.label;
    pill.onclick = () => { state[l.key] = state[l.key]==='on' ? 'off' : 'on'; renderAll(); };
    grid.appendChild(pill);
  });
}

function renderOptions(){
  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  OPTIONS.forEach(o => {
    const row = document.createElement('div');
    row.className = 'opt-row';
    row.innerHTML = '<span class="opt-label">' + o.label + '</span><button type="button" class="switch' + (state[o.key]==='on' ? ' is-on' : '') + '"></button>';
    row.querySelector('.switch').onclick = () => { state[o.key] = state[o.key]==='on' ? 'off' : 'on'; renderAll(); };
    grid.appendChild(row);
  });
}

function renderAll(){
  renderProviders();
  renderQualities();
  renderLangs();
  renderOptions();
  updateSummary();
}

function install(){
  const url = getAddonUrl();
  document.getElementById('url-box').style.display = 'block';
  document.getElementById('copy-btn').style.display = 'block';
  document.getElementById('addon-url').textContent = url;
  setTimeout(()=>{
    window.location.href = 'stremio://' + url.replace('https://','').replace('http://','');
  }, 500);
}

function copyUrl(){
  navigator.clipboard.writeText(getAddonUrl()).then(()=>{
    document.getElementById('copy-btn').textContent = 'Copied!';
    setTimeout(()=>{ document.getElementById('copy-btn').textContent = 'Copy URL'; }, 2000);
  });
}

initState();
renderAll();
</script>
</body>
</html>
